[project]
name = "asoc-backend"
version = "0.1.0"
requires-python = ">=3.12"
# Installed with `uv pip install -r pyproject.toml` — no build backend needed,
# the app is run as a module, not packaged.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "qdrant-client>=1.12",
]

[dependency-groups]
dev = ["pytest>=8.3"]
