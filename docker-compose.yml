services:
  qdrant:
    # Pinned, and kept within one minor of qdrant-client in backend/pyproject.toml.
    # Bumping this across an existing ./qdrant_storage panics on startup — segment.json is not
    # forward-compatible. Delete qdrant_storage and re-run `python -m app.rag.index` after a bump.
    image: qdrant/qdrant:v1.18.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      # qdrant image has no curl/wget; its own binary can probe the API
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ponytail: Langfuse v2 = 2 containers. v3 needs clickhouse + redis + minio + a
  # worker (6 total) — not worth the RAM next to Qdrant and local ONNX models.
  # Upgrade to v3 only if you need v3-only features (datasets v2, prompt experiments).
  langfuse-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: ${LANGFUSE_HOST}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      TELEMETRY_ENABLED: "false"

volumes:
  langfuse_pgdata:
